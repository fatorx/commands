# Configuração do Alembic do cockpit.
# O URL real vem da variável DATABASE_URL (ver migrations/env.py).
# Padrão local sem a variável: postgresql+psycopg://cockpit:cockpit@localhost:5432/cockpit

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# URL usado apenas como fallback; env.py sempre sobrescreve com DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S